<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Weather App</title>
  <style>
      * {
    box-sizing: border-box;
  }
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f4f4f4;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    input[type="text"], input[type="email"], input[type="search"], input[type="time"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 2px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #6bad1f;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Weather App</h2>
    <input type="search" placeholder="Enter location" id="searchBox">
    <input type="time" id="timeInput">
    <button onclick="handleSubmit()">Submit</button>
  </div>

  <script>
    function handleSubmit() {
      const time = document.getElementById("timeInput").value;
      const search = document.getElementById("searchBox").value;

      alert("Submitted!\nLocation: " + search + "\nTime: " + time);
    }
  </script>

</body>
</html>
